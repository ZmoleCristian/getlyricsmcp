[package]
name = "getlyricsmcp"
version = "0.1.0"
edition = "2024"
authors = ["Zmole Cristian"]
description = "MCP server that finds and fetches song lyrics from many sites. No API keys, no search engine — it guesses each site's URL from artist+title."
license = "0BSD"
repository = "https://github.com/ZmoleCristian/getlyricsmcp"
readme = "README.md"
keywords = ["mcp", "lyrics", "scraper", "ai", "rmcp"]
categories = ["command-line-utilities", "multimedia::audio", "web-programming"]
exclude = ["CLAUDE.md", "law.toml", ".claude", ".mcp.json"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
rmcp = { version = "0.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["sync"] }
